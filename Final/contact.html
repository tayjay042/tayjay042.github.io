<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Road Trip | Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="siteHeader">
        <div class="headerContainer">
            <img src="img/logo300x194.png" alt="RoadTrip Logo">
            <nav>
                <hr>
                <a href="index.html">HOME</a>
                <a href="menu.html">MENU</a>
                <a href="gallery.html">GALLERY</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
                <hr>
            </nav>
        </div>
    </header>

    <main>
        <h2 class="subTitle">Contact Us</h2>
        <form action="#" method="post" class="contactForm">
            <fieldset>
                <label>Date<br><input type="date" name="date" required></label>
            </fieldset>
            <hr class="blackBar">
            <fieldset>
                <label>Name<br><input type="text" name="name" required placeholder="Please enter name..."></label><br>
                <label>Birthdate<br><input type="date" name="birthdate" required></label>
            </fieldset>
            <hr class="blackBar">
            <fieldset>
                <label>Street Address<br><input type="text" name="address" required placeholder="Please enter address..."></label><br>
                <label>City<br><input type="text" name="city" required placeholder="Please enter city..."></label><br>
                <label>State<br><input type="text" name="state" required placeholder="Please enter state..."></label><br>
                <label>Zip<br><input type="text" name="zip" required placeholder="Please enter zip code..."></label><br>
            </fieldset>
            <fieldset>
                <label>Favorite Type of Food<br><textarea name="favFood" rows="1" required placeholder="Please enter your favorite type of food..."></textarea></label><br>
                <label for="eatingOut">How often do you eat out?<br></label>
                <select name="eatingOut" id="eatingOut">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="rarely">Rarely</option>
                </select><br><br>
                <button class="redBtn" type="submit">Submit</button>
        </form>
        </fieldset>
        <section class="contactFindUs">
            <h3 class="subTitle">Find Us</h3>
            <p>W1560 County Road KK
                Kaukauna, WI | Open daily 11am–11pm | Phone Number:(920) 766-9339</p>
        </section>
    </main>

    <footer class="siteFooter">
        <div>
            <p>&copy; 2026 Road Trip | W1560 County Road KK, Kaukauna, WI</p>
        </div>
    </footer>
</body>

</html>
